name: Calidad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          SESSION_COOKIE_SECURE: "true"
          SETTINGS_ENCRYPTION_KEY: ci-only-key-with-at-least-32-characters

      - name: Production Docker image
        run: |
          docker build \
            --progress=plain \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t comunidad-conecta-ci:${{ github.sha }} \
            .

      - name: Publish certified image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "comunidad-conecta-ci:${GITHUB_SHA}" "${REGISTRY_IMAGE}:${SHA_TAG}"
          docker tag "comunidad-conecta-ci:${GITHUB_SHA}" "${REGISTRY_IMAGE}:${VERSION}"
          docker push "${REGISTRY_IMAGE}:${SHA_TAG}"
          docker push "${REGISTRY_IMAGE}:${VERSION}"
